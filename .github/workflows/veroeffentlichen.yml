name: Veröffentlichen

# Stellt den Ordner public/ über GitHub Pages bereit (Hosting wie bisher bei SHAHI: GitHub Pages).
# Läuft NUR manuell (Actions → Veröffentlichen → Run workflow) – kein automatisches Deployment.
# Voraussetzung (einmalig, durch den Repo-Inhaber): Settings → Pages → Source: „GitHub Actions“.
# Domain www.shahi-biberach.de erst nach Freigabe in Settings → Pages eintragen (siehe docs/HOSTING-UND-DOMAIN.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seiten erzeugen (prüft die Speisekarte)
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
